# ===================================================================
# Spring Boot Application Configuration
# Concept: Externalized Configuration (application.properties)
# In interviews: Explain how Spring Boot reads properties from
# application.properties, environment variables, command line args, etc.
# ===================================================================

# Application Name
spring.application.name=student-management

# Server Port (Default is 8080)
server.port=8080

# -------------------------------------------------------------------
# H2 In-Memory Database Configuration
# In interviews: H2 is an embedded, in-memory lightweight database
# ideal for development, testing, and prototyping.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 Web Console to view database tables in browser (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# In interviews:
# - ddl-auto options: 'none', 'validate', 'update', 'create', 'create-drop'
# - 'update': updates schema automatically (good for dev, NEVER in prod!)
# - 'validate': validates schema against entities (best for prod with Flyway/Liquibase)
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Custom Application Properties
# Demonstrates @Value and @ConfigurationProperties injection
# -------------------------------------------------------------------
app.welcome-message=Welcome to the Student Management API!
app.max-students-per-page=10
